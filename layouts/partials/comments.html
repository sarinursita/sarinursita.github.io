{{/* giscus — kolom komentar via GitHub Discussions (dipasang 28-09-2026) */}}
{{ if not .Params.disable_comments }}
<section class="post-comments">
  <hr class="wp-block-separator has-alpha-channel-opacity">
  <h2 class="comments-title">💬 Diskusi</h2>
  <p class="comments-hint">Mau ikut nimbrung atau menjawab pertanyaan di atas? Login pakai akun GitHub untuk meninggalkan komentar.</p>
  <div class="giscus-wrap">
    <script src="https://giscus.app/client.js"
            data-repo="sarinursita/sarinursita.github.io"
            data-repo-id="R_kgDONJSe2w"
            data-category="Announcements"
            data-category-id="DIC_kwDONJSe284DGhIU"
            data-mapping="pathname"
            data-strict="1"
            data-reactions-enabled="1"
            data-emit-metadata="0"
            data-input-position="top"
            data-theme="preferred_color_scheme"
            data-lang="id"
            data-loading="lazy"
            crossorigin="anonymous"
            async>
    </script>
  </div>
</section>
{{ end }}
