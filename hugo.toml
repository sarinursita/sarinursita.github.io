baseURL = "https://sarinursita.github.io/"
languageCode = "id"
title = "Sari Nursita"
# sitemap/robots digenerate Hugo (static/robots.txt menimpa template robots bawaan)
disableKinds = ["taxonomy", "term"]
enableGitInfo = false

# Tampilkan konten bertanggal "hari ini" walau build jalan di UTC
# (Sari di GMT+8 → tanggal hari ini bisa kelihatan "masa depan" di UTC).
buildFuture = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

[params]
  copyright = "Sari Nursita"
  author = "Sari Nursita"
  description = "Sari Nursita — programmer, penulis buku IT & buku anak, pengajar, dan fasilitator proyek kreatif untuk anak. Lulusan Ilmu Komputer UI."
  tagline = "Programmer, Penulis, Pengajar, Fasilitator Proyek"
  # Gambar preview default (WhatsApp/Facebook/X) 1200x630
  ogImage = "/images/og-default.jpg"
  # Isi dengan customer id follow.it kalau langganan email/notifikasi diaktifkan
  # followit = "sarinursita"
